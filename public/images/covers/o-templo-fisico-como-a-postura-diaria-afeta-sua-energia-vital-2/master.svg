<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8C5D6" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#6FA8DC" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1C2331" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="48%" r="70%">
      <stop offset="0%" stop-color="#344055" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1C2331" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
