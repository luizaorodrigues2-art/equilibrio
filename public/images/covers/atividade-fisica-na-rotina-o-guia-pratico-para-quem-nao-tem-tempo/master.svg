<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2CC8F" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#7EB8DA" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0D1B2A" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="48%" r="70%">
      <stop offset="0%" stop-color="#1B3A4B" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0D1B2A" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.045"/>
      </feComponentTransfer>
    </filter>
  </defs>
  
        <rect width="1600" height="900" fill="#0D1B2A"/>
